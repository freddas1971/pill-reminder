name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PillReminder-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PillReminder-apk
          path: PillReminder-${{ github.run_number }}.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PillReminder-${{ github.run_number }}.apk \
            --title "Pill Reminder (build ${{ github.run_number }})" \
            --notes "Download the .apk file below on your Android phone to install or update."
